# Publish www.801familystudios.com from main only.
# Feature branches must merge to main — they cannot overwrite production directly.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-gh-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          publish_branch: gh-pages
          force_orphan: false
          enable_jekyll: false
          # Keep CNAME / custom domain and dotfiles like .nojekyll
          keep_files: false
          commit_message: "Deploy website from main"
